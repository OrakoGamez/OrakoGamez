<svg width="1100" height="260" viewBox="0 0 1100 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Orako Gamez learning terminal</title>
<desc id="desc">A terminal-style panel showing current learning focus and project status.</desc>
<rect width="1100" height="260" rx="18" fill="#0d1117"/><rect x="1" y="1" width="1098" height="258" rx="17" fill="none" stroke="#30363d"/>
<rect width="1100" height="46" rx="18" fill="#161b22"/><circle cx="28" cy="23" r="6" fill="#ff5f56"/><circle cx="50" cy="23" r="6" fill="#ffbd2e"/><circle cx="72" cy="23" r="6" fill="#27c93f"/><text x="98" y="28" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">orako@github:~$</text>
<text x="34" y="82" fill="#8b949e" font-family="ui-monospace, monospace" font-size="15">$ whoami</text><text x="150" y="82" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="15">beginner developer</text>
<text x="34" y="118" fill="#8b949e" font-family="ui-monospace, monospace" font-size="15">$ focus</text><text x="150" y="118" fill="#79c0ff" font-family="ui-monospace, monospace" font-size="15">C++  •  Unreal Engine 5  •  Blender</text>
<text x="34" y="154" fill="#8b949e" font-family="ui-monospace, monospace" font-size="15">$ status</text><text x="150" y="154" fill="#7ee787" font-family="ui-monospace, monospace" font-size="15">learning / building / improving</text>
<text x="34" y="190" fill="#8b949e" font-family="ui-monospace, monospace" font-size="15">$ next</text><text x="150" y="190" fill="#d2a8ff" font-family="ui-monospace, monospace" font-size="15">build small projects → share the journey</text>
<text x="34" y="226" fill="#8b949e" font-family="ui-monospace, monospace" font-size="15">$ _</text><rect x="54" y="214" width="8" height="16" fill="#58a6ff" opacity="0.8"/>
</svg>
