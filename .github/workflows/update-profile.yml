name: Update profile progress

on:
  push:
    paths:
      - 'config/skills.json'
      - 'scripts/update_profile.py'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile visuals
        run: python scripts/update_profile.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/progress
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update profile skill progress"
            git push
          fi
